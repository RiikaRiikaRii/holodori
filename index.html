<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Holodori Research</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Holodori Research</h1>

    <p>Record a run:</p>

    <form id="runForm">

        <div class="form-group"> <!-- Boost -->
            <label for="boost">Boost:</label>
            <select id="boost" required>
                <option value="">Select Boost</option>
                <option value="0">0</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="45">45</option>
                <option value="60">60</option>
                <option value="75">75</option>
                <option value="90">90</option>
            </select>
        </div>

        <div class="form-group"> <!-- Event -->
            <label for="eventName">Event:</label>
            <select id="eventName">
                <option value="None">None</option>
                <option value="Event">Event</option>
                <option value="BoostedEvent">Boosted Event</option>
            </select>
        </div>

        <div class="form-group"> <!-- Jumps -->
            <label for="jumps">Jumps:</label>
            <input type="number" id="jumps" min="0" required>
        </div>

        <div class="form-group"> <!-- Timber -->
            <label for="timber">Timber:</label>
            <input type="number" id="timber" min="0" required>
        </div>

        <div class="form-group"> <!-- Nails -->
            <label for="nails">Nails:</label>
            <input type="number" id="nails" min="0" required>
        </div>

        <div class="form-group"> <!-- Stone -->
            <label for="stone">Stone:</label>
            <input type="number" id="stone" min="0" required>
        </div>

        <div class="form-group"> <!-- Hologold -->
            <label for="hologold">Hologold:</label>
            <input type="number" id="hologold" min="0" required>
        </div>

        <div class="form-group"> <!-- Auto Tickets -->
            <label for="autoTickets">Auto Tickets:</label>
            <input type="number" id="autoTickets" min="0" required>
        </div>

        <div class="form-group"> <!-- Event Points -->
            <label for="eventPoints">Event Points:</label>
            <input type="number" id="eventPoints">
        </div>

        <button id="recordButton" type="submit">Record Run</button>

    </form>

    <p id="result"></p>

    <table id="runTable">

        <thead>
            <tr>
                <th>#</th>
                <th>Jumps</th>
                <th>Boost</th>
                <th>Wood</th>
            </tr>
        </thead>

        <tbody id="runTableBody">
        </tbody>

    </table>

    <script src="script.js"></script>
</body>

</html>
